<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unifor-maps</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>
<body>
    
    <header>
        <div id="header-brand">
            <img src="./assets/logo-unifor.png" alt="logo-unifor">
            <p>Unifor Maps</p>
        </div>

        <nav id="header-links">
            <a href="index.html">Home</a>
            <a href="./pages/nep.html">NEP</a>
            <a href="./pages/cc.html">CC</a>
            <a href="./pages/biblioteca.html">Biblioteca</a>
            <a href="./pages/academia.html">Academia</a>
            <a href="./pages/natacao.html">Natação</a>
        </nav>
    </header>

    <main>
        <section class="main-section">
            <div id="main-inputs">
                <h1>Encontre qualquer lugar no mapa, basta digitar as coordenadas!</h1>

                <label for="nome">Nome</label>
                <input type="text" name="nome" id="nome">

                <label for="latitude">Latitude</label>
                <input type="text" name="latitude" id="latitude">

                <label for="longitude">Longitude</label>
                <input type="text" name="longitude" id="longitude">


                <button id="btn-adicionar">
                    <a href="#main-maps">Adicionar ponto</a>
                </button>
            </div>
        </section>

        <section class="main-section">
            <div id="main-border">
                <div 
                    id="main-maps" 
                    data-lat="-3.7687837789857697" 
                    data-lng="-38.47807455502943"
                    data-titulo="Unifor">
                </div>
            </div>
        </section>
    </main>

    <script src="./js/mapa.js" defer></script>
    <script src="./js/home.js" defer></script>
    <script src="https://maps.googleapis.com/maps/api/js?callback=initMap&libraries=marker&loading=async" defer></script>
</body>
</html>
